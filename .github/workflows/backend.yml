name: Backend

on:
  pull_request:
  push:
    branches: [development, staging, main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.9"
  GOTOOLCHAIN: local
  # Each module must build on its own go.mod (as in the Docker builds).
  GOWORK: "off"

jobs:
  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [shared/go, gateway/api-gateway, services/verification-service, services/media-document-service, services/notification-service, services/individual-owner-service, tests/e2e]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "::error::gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          "$(go env GOPATH)/bin/staticcheck" ./...

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Architecture boundary self-test
        run: scripts/ci/check-architecture.sh --self-test
      - name: Architecture boundaries
        run: scripts/ci/check-architecture.sh

  sqlc:
    name: sqlc generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: sqlc diff
        run: |
          for svc in verification-service media-document-service notification-service individual-owner-service; do
            echo "== $svc"
            (cd "services/$svc" && "$(go env GOPATH)/bin/sqlc" diff -f sql/sqlc.yaml)
          done

  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [shared/go, gateway/api-gateway, services/verification-service, services/media-document-service, services/notification-service, services/individual-owner-service]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Integration tests fail (never skip) when infrastructure is missing.
      CF_REQUIRE_INTEGRATION: "1"
      CF_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      CF_TEST_REDIS_ADDR: 127.0.0.1:6379
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Start MinIO (real S3 checksum enforcement)
        if: matrix.module == 'services/media-document-service'
        working-directory: .
        run: |
          # Built from a pinned source revision (no maintained container tag is assumed).
          GOWORK=off go install github.com/minio/minio@v0.0.0-20260212201848-7aac2a2c5b7c
          mkdir -p "$RUNNER_TEMP/minio"
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin nohup "$(go env GOPATH)/bin/minio" server "$RUNNER_TEMP/minio" --address 127.0.0.1:9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9000/minio/health/ready && break; sleep 1; done
          curl -sf http://127.0.0.1:9000/minio/health/ready
          echo "CF_TEST_S3_ENDPOINT=http://127.0.0.1:9000" >> "$GITHUB_ENV"
      - name: go test -race (unit, integration, migrations, contracts)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  e2e:
    name: end-to-end (all foundation components as processes)
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CF_REQUIRE_INTEGRATION: "1"
      CF_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      CF_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: go test (tests/e2e)
        working-directory: tests/e2e
        run: go test -race -count=1 -v ./...
