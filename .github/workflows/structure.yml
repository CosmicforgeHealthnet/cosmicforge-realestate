name: Architecture structure

on:
  pull_request:
  push:
    branches: [development, staging, main]

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify locked service roots
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            gateway/api-gateway \
            services/marketplace-service \
            services/individual-owner-service \
            services/business-operations-service \
            services/property-manager-service \
            services/artisan-service \
            services/professional-services-service \
            services/admin-service \
            services/verification-service \
            services/payment-service \
            services/notification-service \
            services/media-document-service \
            integrations/cf-meet \
            integrations/paystack \
            integrations/firebase \
            infrastructure/docker/staging \
            infrastructure/docker/production \
            infrastructure/terraform/environments/staging \
            infrastructure/terraform/environments/production \
            postman/environments
          do
            test -d "$p"
          done

          test ! -e services/identity-service

      - name: Verify Postman handoff artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f postman/CosmicForge_RealEstate.postman_collection.json
          test -f postman/environments/local.postman_environment.json
          test -f postman/environments/development.postman_environment.json
          test -f postman/environments/staging.postman_environment.json
          test -f postman/README.md

          python -m json.tool postman/CosmicForge_RealEstate.postman_collection.json >/dev/null
          python -m json.tool postman/environments/local.postman_environment.json >/dev/null
          python -m json.tool postman/environments/development.postman_environment.json >/dev/null
          python -m json.tool postman/environments/staging.postman_environment.json >/dev/null
