name: Security

on:
  pull_request:
  push:
    branches: [development, staging, main]
  schedule:
    - cron: "17 3 * * 1" # weekly: new vulnerabilities in unchanged code

permissions:
  contents: read

env:
  GO_VERSION: "1.26.9"
  GOTOOLCHAIN: local
  GOWORK: "off"

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [shared/go, gateway/api-gateway, services/verification-service, services/media-document-service, services/notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: "$(go env GOPATH)/bin/govulncheck ./..."

  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - name: gitleaks (git history)
        run: "$(go env GOPATH)/bin/gitleaks git --redact --exit-code 1 ."
      - name: gitleaks (working tree)
        run: "$(go env GOPATH)/bin/gitleaks dir --redact --exit-code 1 ."

  config:
    name: IaC / Dockerfile misconfiguration scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
