<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CosmicForge · Owner design references</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#17263c;background:#f6f8fc}*{box-sizing:border-box}body{margin:0}header{padding:32px 5vw;background:white;border-bottom:1px solid #dce4f0}h1{margin:0}p{color:#536479;line-height:1.6}.filters{display:flex;gap:16px;flex-wrap:wrap}label{display:grid;gap:6px}input,select{min-height:44px;padding:10px;border:1px solid #536479;border-radius:10px;font:inherit}input{width:min(440px,80vw)}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:24px;padding:24px 5vw}.card{background:white;border:1px solid #dce4f0;border-radius:16px;overflow:hidden;scroll-margin-top:24px}.card[hidden]{display:none}.preview{height:340px;display:block;background:#edf2fa;text-align:center}.preview img{height:100%;max-width:100%;object-fit:contain}.body{padding:20px}h2{font-size:20px}.tag{color:#087a66;font-size:12px;font-weight:700}nav{display:flex;flex-wrap:wrap;gap:16px}a{color:#1743b8}nav a{padding:10px 0}a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2459e0;outline-offset:3px}#count{display:block;padding-top:16px}
</style></head><body><header><h1>Individual Owner · Design library</h1><p>15 desktop / mobile pairs. Original Stitch references; demonstration claims in source HTML are unverified. PNGs work offline.</p><p><a href="original/stitch_individual_owner_design_system/individual_owner_design.md">Original design specification</a> · <a href="original/stitch_individual_owner_design_system/cosmicforge_individual_owner/DESIGN.md">Original token document</a> · <a href="inventory.json">Inventory</a> · <a href="SHA256SUMS.txt">Checksums</a></p><div class="filters"><label>Search screens<input id="search" type="search" placeholder="Dashboard, wallet, property…"></label><label>Platform<select id="platform"><option value="ALL">All platforms</option><option value="DESKTOP">Desktop</option><option value="MOBILE">Mobile</option></select></label></div><output id="count" aria-live="polite">30 screens</output></header><main><!-- SCREEN_CARDS --></main><script>
const search=document.getElementById('search'),platform=document.getElementById('platform'),cards=[...document.querySelectorAll('.card')];
function filter(){let count=0;for(const card of cards){card.hidden=!(platform.value==='ALL'||card.dataset.platform===platform.value)||!card.dataset.search.toLowerCase().includes(search.value.trim().toLowerCase());if(!card.hidden)count++}document.getElementById('count').textContent=`${count} screens`}
search.addEventListener('input',filter);platform.addEventListener('change',filter);document.querySelectorAll('.pair').forEach(link=>link.addEventListener('click',()=>{search.value='';platform.value='ALL';filter();const target=document.getElementById(link.dataset.target);target.tabIndex=-1;target.focus()}));
</script></body></html>
