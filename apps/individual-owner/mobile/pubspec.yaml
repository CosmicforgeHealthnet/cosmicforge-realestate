name: cosmicforge_owner
description: "CosmicForge Individual Owner mock foundation. Fictional records only."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^2.0.0
  dio: ^5.11.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dashboard.json
    - assets/modules.json
    - assets/workflows.json
    - assets/workspace-seed.json
    - assets/fonts/OFL.txt
    - assets/fonts/Roboto-LICENSE.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
