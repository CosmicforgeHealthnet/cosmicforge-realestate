          type:
            - number
            - "null"
        limitations:
          items:
            type: string
          type: array
        longitude:
          type:
            - number
            - "null"
        property_id:
          format: uuid
          type: string
        property_type:
          type: string
        property_version:
          type: integer
        ready_photo_count:
          type: integer
        restricted:
          type: boolean
        state_region:
          type: string
        status:
          type: string
        title:
          type: string
        verification_level:
          type: string
        verified_at:
          format: date-time
          type:
            - string
            - "null"
      required:
        - property_id
        - status
        - category
        - property_type
        - title
        - city
        - state_region
        - country_code
        - authority_verified
        - verification_level
        - restricted
        - ready_photo_count
        - limitations
        - property_version
        - generated_at
