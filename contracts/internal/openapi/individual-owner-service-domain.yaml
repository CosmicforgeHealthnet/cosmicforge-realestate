          maximum: 10000
          minimum: -10000
          type: integer
        to:
          description: 'SEASONAL: MM-DD (inclusive, may wrap the year)'
          pattern: ^(?:(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01]))$
          type: string
      type: object
    TransferView:
      properties:
        case_type:
          type: string
        created_at:
          format: date-time
          type: string
        decision_note:
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        property_id:
          format: uuid
          type: string
        reason:
          type:
            - string
            - "null"
        recipient_accepted:
          type: boolean
        status:
          type: string
        to_email:
          type:
            - string
            - "null"
        updated_at:
          format: date-time
          type: string
        version:
          type: integer
      required:
        - id
        - property_id
        - case_type
        - status
        - recipient_accepted
        - version
        - created_at
        - updated_at
      type: object
  securitySchemes:
    ServiceBearer:
      bearerFormat: service+jwt (EdDSA)
      scheme: bearer
      type: http
info:
