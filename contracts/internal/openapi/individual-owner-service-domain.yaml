          type: array
        expires_at:
          format: date-time
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        is_primary:
          type: boolean
        reason_code:
          type:
            - string
            - "null"
        status:
          type: string
        updated_at:
          format: date-time
          type: string
