  securitySchemes:
    ServiceBearer:
      bearerFormat: service+jwt (EdDSA)
      scheme: bearer
      type: http
info:
  description: |-
    Service-to-service domain API of individual-owner-service (Section 9). Authorization:
    Bearer <service JWT> (aud individual-owner-service). A valid token is not sufficient: each operation
    has a capability allow-list of calling services (and delegated actor domains), evaluated by the
    service's policy engine. No other service ever reads individual_owner_db directly.
  title: individual-owner-service — internal domain API (Section 9)
  version: 1.0.0
openapi: 3.1.0
paths:
  /internal/v1/owner/applications:
    post:
      operationId: customerSubmitApplication
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerApplicationInputInput'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/ApplicationView'
                required:
                  - data
                type: object
          description: Created
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
      security:
        - ServiceBearer: []
      summary: Marketplace rental application
      tags:
        - _Internal
  /internal/v1/owner/applications/{application_id}/customer-action:
    post:
      operationId: customerApplicationAction
      parameters:
        - in: path
          name: application_id
          required: true
          schema:
            format: uuid
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerApplicationActionInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/ApplicationEvent'
                required:
                  - data
                type: object
          description: OK
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
      security:
        - ServiceBearer: []
      summary: Customer withdraws or appeals
      tags:
        - _Internal
  /internal/v1/owner/applications/{application_id}/evidence:
    post:
      operationId: customerProvideEvidence
      parameters:
        - in: path
          name: application_id
          required: true
          schema:
            format: uuid
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerEvidenceInputInput'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/EvidenceGrantView'
                required:
                  - data
                type: object
          description: Created
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
      security:
        - ServiceBearer: []
      summary: Customer grants time-limited evidence
      tags:
        - _Internal
  /internal/v1/owner/inquiries:
    post:
      description: 'Caller: marketplace-service with a delegated marketplace customer actor. Message content stays in CF Meet.'
      operationId: customerCreateInquiry
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInquiryInputInput'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/InquiryView'
                required:
                  - data
                type: object
          description: Created
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
      security:
        - ServiceBearer: []
      summary: Marketplace inquiry for a published listing
      tags:
        - _Internal
