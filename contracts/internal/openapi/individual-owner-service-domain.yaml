info:
  description: |-
    Service-to-service domain API of individual-owner-service (Section 9). Authorization:
    Bearer <service JWT> (aud individual-owner-service). A valid token is not sufficient: each operation
    has a capability allow-list of calling services (and delegated actor domains), evaluated by the
    service's policy engine. No other service ever reads individual_owner_db directly.
  title: individual-owner-service — internal domain API (Section 9)
  version: 1.0.0
openapi: 3.1.0
paths:
  /internal/v1/owner/ownership-conflicts:
    get:
      operationId: listOwnershipConflicts
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/ConflictView'
                    type: array
                  page:
                    $ref: '#/components/schemas/Page'
                required:
                  - data
                  - page
                type: object
          description: OK
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
      security:
        - ServiceBearer: []
      summary: Ownership claims in CONFLICT awaiting review
      tags:
        - _Admin
