  securitySchemes:
    ServiceBearer:
      bearerFormat: service+jwt (EdDSA)
      scheme: bearer
      type: http
info:
  description: |-
    Service-to-service domain API of individual-owner-service (Section 9). Authorization:
    Bearer <service JWT> (aud individual-owner-service). A valid token is not sufficient: each operation
    has a capability allow-list of calling services (and delegated actor domains), evaluated by the
    service's policy engine. No other service ever reads individual_owner_db directly.
  title: individual-owner-service — internal domain API (Section 9)
  version: 1.0.0
openapi: 3.1.0
paths:
  /internal/v1/owner/admin/agreement-templates:
    get:
      operationId: adminListAgreementTemplates
      parameters:
        - in: query
          name: country
          schema:
            type: string
        - in: query
          name: agreement_kind
          schema:
            type: string
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/AgreementTemplateView'
                    type: array
                  page:
                    $ref: '#/components/schemas/Page'
                required:
                  - data
                  - page
                type: object
          description: OK
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
      security:
        - ServiceBearer: []
      summary: All agreement template versions
      tags:
        - _Admin
    post:
      operationId: adminPublishAgreementTemplate
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreementTemplateInputInput'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AgreementTemplateView'
                required:
                  - data
                type: object
          description: Created
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
      security:
        - ServiceBearer: []
      summary: Publish the next agreement template version
      tags:
        - _Admin
  /internal/v1/owner/admin/agreement-templates/{template_id}/retire:
    post:
      operationId: adminRetireAgreementTemplate
      parameters:
        - in: path
          name: template_id
          required: true
          schema:
            format: uuid
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AgreementTemplateView'
                required:
                  - data
                type: object
          description: OK
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
      security:
        - ServiceBearer: []
      summary: Retire an agreement template version
      tags:
        - _Admin
  /internal/v1/owner/admin/damage-claims/{claim_id}/resolution:
    post:
      description: The award (≤ claim) is then settled through payment-service or off-platform evidence.
      operationId: adminResolveDamageClaim
      parameters:
        - in: path
          name: claim_id
          required: true
          schema:
            format: uuid
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DamageClaimResolutionInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/DamageClaimView'
                required:
                  - data
                type: object
          description: OK
        "400":
