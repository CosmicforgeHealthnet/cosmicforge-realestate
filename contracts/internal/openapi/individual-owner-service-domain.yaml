          enum:
            - RELEASE
            - REJECT
          type: string
        note:
          maxLength: 2000
          type: string
        reason_code:
          pattern: ^(?:[A-Z][A-Z0-9_]{1,63})$
          type: string
      required:
        - decision
        - reason_code
      type: object
    RestrictInputInput:
      additionalProperties: false
      properties:
