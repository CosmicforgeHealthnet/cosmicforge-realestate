{
  "openapi": "3.1.0",
  "info": {
    "title": "admin-service internal API",
    "version": "1.0.0",
    "description": "Signed service-to-service routes (EdDSA service JWT in Authorization, explicit caller allow-list). Never routed by the public gateway."
  },
  "paths": {
    "/internal/v1/cases": {
      "post": {
        "summary": "Open a moderation, financial remedy or high-risk case (idempotent per source reference).",
        "operationId": "internaladminPOST_cases",
        "security": [
          {
            "serviceToken": []
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "type": "object"
                    }
                  },
                  "required": [
                    "data"
                  ]
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object"
              }
            }
          }
        },
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
    "/internal/v1/cases/by-source": {
      "get": {
        "summary": "Authoritative case readback for the raising service (query: kind, reference).",
        "operationId": "internaladminGET_cases_by_source",
        "security": [
          {
            "serviceToken": []
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "type": "object"
                    }
                  },
                  "required": [
                    "data"
                  ]
                }
              }
            }
          }
        }
      }
    },
    "/internal/v1/cases/{id}/appeals": {
      "post": {
        "summary": "Open the single appeal of a decided case.",
        "operationId": "internaladminPOST_cases_id_appeals",
        "security": [
          {
            "serviceToken": []
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "type": "object"
                    }
                  },
                  "required": [
                    "data"
                  ]
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object"
              }
            }
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    }
  },
  "components": {
    "securitySchemes": {
      "serviceToken": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "service JWT"
      }
    }
  }
}
