{
  "openapi": "3.1.0",
  "info": {
    "title": "Paystack durable webhook",
    "version": "1.0.0",
    "description": "Blueprint v1.0 Sections 1-14. Live custody, collections and payouts disabled; explicitly approved test-mode payout workflow available. Internal service JWT audience payment-service. Public surface requires gateway user JWT; backend validates signed gateway delegation in X-Service-Authorization. There is no arbitrary balance or journal mutation endpoint."
  },
  "paths": {
    "/webhooks/v1/paystack/{id}/callbacks": {
      "post": {
        "summary": "POST /webhooks/v1/paystack/{id}/callbacks",
        "operationId": "POST_webhooks_v1_paystack_id_callbacks",
        "description": "Gateway service JWT plus Paystack HMAC-SHA512 over raw bytes using the selected merchant secret. Acknowledge only after durable insertion; duplicates retain retry state. Maximum 64 KiB. No raw card/BVN payload persisted.",
        "security": [
          {
            "ServiceJWT": []
          }
        ],
        "responses": {
          "200": {
            "description": "Authoritative result (test mode; capability status is explicit)",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "type": "object",
                      "properties": {
                        "received": {
                          "type": "boolean"
                        }
                      },
                      "required": [
                        "received"
                      ],
                      "additionalProperties": false
                    }
                  },
                  "required": [
                    "data"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "400": {
            "description": "Platform error envelope; financial safety/error codes in x-error-codes.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Platform error envelope; financial safety/error codes in x-error-codes.",
            "content": {
              "application/json": {
