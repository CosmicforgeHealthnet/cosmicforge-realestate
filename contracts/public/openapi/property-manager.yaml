{
  "openapi": "3.1.0",
  "info": {
    "title": "Property Manager API",
    "version": "1.0.0",
    "description": "Mandates projected from Business manager assignments. Acceptance, capability decisions and delegated actions are re-validated live by Business; revocation, suspension and expiry follow Business events."
  },
  "servers": [
    {
      "url": "{gateway}",
      "variables": {
        "gateway": {
          "default": "http://localhost:8080"
        }
      }
    }
  ],
  "paths": {
    "/api/v1/property-manager/auth/login": {
      "post": {
        "summary": "Log in; returns access and refresh tokens.",
        "operationId": "property_managerPOST_auth_login",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "type": "object"
                    }
                  },
                  "required": [
                    "data"
                  ]
                }
              }
            }
          },
          "default": {
            "description": "Platform error envelope",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "security": [],
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "email": {
                    "type": "string"
                  },
                  "password": {
                    "type": "string"
                  }
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/property-manager/auth/logout": {
      "post": {
        "summary": "Revoke the current session.",
