  "components": {
    "schemas": {
      "Provision": {
        "type": "object",
        "properties": {
          "domain": {
            "type": "string",
            "minLength": 1
          },
          "account_id": {
            "type": "string",
            "format": "uuid"
          },
          "role": {
            "type": "string",
            "minLength": 1
          },
          "party_kind": {
            "type": "string",
            "enum": [
              "PERSON",
              "ORGANIZATION"
            ]
          },
          "legal_entity": {
            "type": "string",
            "minLength": 1
          },
          "currency": {
            "type": "string",
            "pattern": "^[A-Z]{3}$",
            "description": "Validated ISO 4217 currency; integer minor units."
          },
          "registration_ref": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "domain",
          "account_id",
          "role",
          "party_kind",
          "legal_entity",
          "currency",
          "registration_ref"
        ],
        "additionalProperties": false
      },
      "Wallet": {
        "type": "object",
        "properties": {
          "wallet_id": {
            "type": "string",
            "format": "uuid"
          },
          "identity_id": {
            "type": "string",
            "format": "uuid"
          },
          "domain": {
            "type": "string",
            "minLength": 1
          },
          "role": {
            "type": "string",
            "minLength": 1
          },
          "legal_entity": {
            "type": "string",
            "minLength": 1
          },
          "currency": {
            "type": "string",
            "pattern": "^[A-Z]{3}$",
            "description": "Validated ISO 4217 currency; integer minor units."
          },
          "state": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "RESTRICTED",
              "CLOSED"
            ]
          }
        },
        "required": [
          "wallet_id",
          "identity_id",
          "domain",
          "role",
          "legal_entity",
          "currency",
          "state"
        ],
        "additionalProperties": false
      },
      "Balance": {
        "type": "object",
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "PAYMENT_PENDING",
              "PENDING_EARNINGS",
