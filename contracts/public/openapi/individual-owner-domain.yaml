    OwnerBearer:
      bearerFormat: owner at+jwt (EdDSA)
      scheme: bearer
      type: http
info:
  description: |-
    Owner-facing domain API of individual-owner-service (Sections 6–13 of the Individual Owner
    Backend Implementation Specification v1.0), reached only through the API Gateway under
    /api/v1/owner/*. Authentication, sessions and account security (Section 5) are documented in
    individual-owner.yaml.

    Conventions
    * Authorization: Bearer <owner access token>. Every property-scoped operation is authorized
      against the caller's relationship to that exact property (owner, co-owner, authorized
      representative with explicit capabilities and validity window); unrelated properties answer 404.
    * Commands that create, publish, approve, withdraw, decide or have financial/external side effects
      require Idempotency-Key: same key + same body replays the stored response
      (Idempotent-Replayed: true); same key + different body → 409 IDEMPOTENCY_CONFLICT.
    * PATCH/PUT require If-Match with the quoted resource version from GET (428 when missing,
      409 VERSION_CONFLICT when stale). Singleton resources accept If-Match: "0" to create.
    * Operations marked step-up need a re-authentication within the step-up window (403 STEP_UP_REQUIRED).
    * Collections use cursor pagination: {"data": [...], "page": {"next_cursor", "has_more"}}.
    * Features whose external dependency is not configured or not implemented answer
      503 FEATURE_UNAVAILABLE (never a simulated success).
  title: Individual Owner — domain API (Sections 6–13)
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/owner/account/status:
    get:
      operationId: getAccountStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AccountStatusView'
                required:
                  - data
                type: object
          description: OK
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
      security:
        - OwnerBearer: []
      summary: Account status, activation rule and sensitive-action gates
      tags:
        - Account & Profile
  /api/v1/owner/co-owner-invitations:
    get:
      operationId: listCoOwnerInvitations
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/InvitationView'
                    type: array
                  page:
                    $ref: '#/components/schemas/Page'
                required:
                  - data
                  - page
                type: object
          description: OK
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
      security:
        - OwnerBearer: []
      summary: Invitations addressed to my verified email
      tags:
        - Account & Profile
  /api/v1/owner/co-owner-invitations/{party_id}/accept:
    post:
      operationId: acceptCoOwnerInvitation
      parameters:
        - in: path
          name: party_id
          required: true
          schema:
            format: uuid
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/PartyView'
                required:
                  - data
                type: object
          description: OK
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
      security:
        - OwnerBearer: []
      summary: Accept a co-ownership / representation invitation
      tags:
        - Account & Profile
  /api/v1/owner/co-owner-invitations/{party_id}/decline:
    post:
      operationId: declineCoOwnerInvitation
      parameters:
        - in: path
          name: party_id
          required: true
          schema:
            format: uuid
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/PartyView'
                required:
                  - data
                type: object
          description: OK
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
      security:
        - OwnerBearer: []
      summary: Decline an invitation
      tags:
        - Account & Profile
  /api/v1/owner/consents:
    get:
      operationId: listMyPendingConsents
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/PendingConsentView'
                    type: array
                  page:
                    $ref: '#/components/schemas/Page'
                required:
                  - data
                  - page
                type: object
          description: OK
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
      security:
        - OwnerBearer: []
      summary: Co-owner consents awaiting my decision
      tags:
        - Account & Profile
  /api/v1/owner/consents/{consent_id}/decision:
