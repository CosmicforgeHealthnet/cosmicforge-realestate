  securitySchemes:
    OwnerBearer:
      bearerFormat: owner at+jwt (EdDSA)
      scheme: bearer
      type: http
info:
  description: |-
    Owner-facing domain API of individual-owner-service (Sections 6–13 of the Individual Owner
    Backend Implementation Specification v1.0), reached only through the API Gateway under
    /api/v1/owner/*. Authentication, sessions and account security (Section 5) are documented in
    individual-owner.yaml.

    Conventions
    * Authorization: Bearer <owner access token>. Every property-scoped operation is authorized
      against the caller's relationship to that exact property (owner, co-owner, authorized
      representative with explicit capabilities and validity window); unrelated properties answer 404.
    * Commands that create, publish, approve, withdraw, decide or have financial/external side effects
      require Idempotency-Key: same key + same body replays the stored response
      (Idempotent-Replayed: true); same key + different body → 409 IDEMPOTENCY_CONFLICT.
    * PATCH/PUT require If-Match with the quoted resource version from GET (428 when missing,
      409 VERSION_CONFLICT when stale). Singleton resources accept If-Match: "0" to create.
    * Operations marked step-up need a re-authentication within the step-up window (403 STEP_UP_REQUIRED).
    * Collections use cursor pagination: {"data": [...], "page": {"next_cursor", "has_more"}}.
    * Features whose external dependency is not configured or not implemented answer
      503 FEATURE_UNAVAILABLE (never a simulated success).
  title: Individual Owner — domain API (Sections 6–13)
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/owner/access/devices:
    get:
      operationId: listAccessDevices
      parameters:
        - description: Required
          in: query
          name: property_id
          schema:
            type: string
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/AccessDeviceView'
                    type: array
                  page:
                    $ref: '#/components/schemas/Page'
                required:
                  - data
                  - page
                type: object
          description: OK
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
      security:
        - OwnerBearer: []
      summary: Access devices and key sets of a property
      tags:
        - Smart Access
    post:
      description: Smart locks and keypads need a smart-access provider (503).
      operationId: registerAccessDevice
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessDeviceInputInput'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AccessDeviceView'
                required:
                  - data
                type: object
          description: Created
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
      security:
        - OwnerBearer: []
      summary: Register a device, lockbox, key or card
      tags:
        - Smart Access
  /api/v1/owner/access/grants:
    get:
      operationId: listAccessGrants
      parameters:
        - in: query
          name: property_id
          schema:
            type: string
        - in: query
          name: status
          schema:
            enum:
              - REQUESTED
              - APPROVED
              - ISSUED
              - ACTIVE
              - EXPIRED
              - REVOKED
              - COMPROMISED
            type: string
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/GrantView'
                    type: array
                  page:
                    $ref: '#/components/schemas/Page'
                required:
                  - data
                  - page
                type: object
          description: OK
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
      security:
        - OwnerBearer: []
      summary: Access grants
      tags:
        - Smart Access
    post:
      description: For a confirmed viewing, live tenancy, confirmed stay, active manager mandate or active maintenance job, within its period; ends automatically with it. Smart credentials are provisioned by the provider; keys/cards are issued with a handover record.
      operationId: createAccessGrant
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantInputInput'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/GrantView'
                required:
                  - data
                type: object
          description: Created
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "422":
          $ref: '#/components/responses/Error'
      security:
        - OwnerBearer: []
      summary: Grant time-limited access
      tags:
        - Smart Access
  /api/v1/owner/access/grants/{grant_id}/actions:
    post:
      description: A compromised credential is revoked immediately with a security notification.
      operationId: actOnAccessGrant
      parameters:
        - in: path
          name: grant_id
          required: true
          schema:
            format: uuid
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantActionInput'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/GrantView'
                required:
                  - data
                type: object
          description: OK
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
