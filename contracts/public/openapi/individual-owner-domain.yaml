            - "null"
        status:
          type: string
        unit_id:
          format: uuid
          type:
            - string
            - "null"
        updated_at:
          format: date-time
          type: string
        version:
          type: integer
        warranty_until:
          type:
            - string
            - "null"
      required:
        - id
        - property_id
        - asset_type
        - name
        - status
        - version
        - created_at
        - updated_at
