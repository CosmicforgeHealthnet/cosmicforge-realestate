# Generated from the individual-owner-service route registry (cmd/apidocgen); do not edit by hand.
components:
  responses:
    Error:
      content:
        application/json:
          schema:
            $ref: ../../schemas/error-envelope.schema.json
      description: Platform error envelope.
  schemas:
