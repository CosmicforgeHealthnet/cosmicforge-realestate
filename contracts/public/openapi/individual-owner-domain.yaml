      properties:
        account_id:
          format: uuid
          type: string
        activation_rule:
          type: string
        closure_effective_at:
          format: date-time
          type:
            - string
            - "null"
        email_verified:
          type: boolean
        gates:
          items:
            $ref: '#/components/schemas/GateView'
          type: array
        identity_verification_expires_at:
          format: date-time
          type:
            - string
            - "null"
        identity_verification_status:
          description: NONE or the latest IDENTITY verification status
          type: string
        mfa_enabled:
          type: boolean
        phone_verified:
          type: boolean
        policy_version:
          type: string
        status:
          type: string
      required:
        - account_id
        - status
        - activation_rule
        - email_verified
        - phone_verified
        - mfa_enabled
        - identity_verification_status
        - gates
        - policy_version
      type: object
    ActivityView:
      properties:
        activity_type:
          type: string
        actor_domain:
          type:
            - string
            - "null"
        actor_id:
          format: uuid
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        occurred_at:
          format: date-time
          type: string
        ref_id:
          format: uuid
          type:
            - string
            - "null"
        ref_service:
