# Generated from the individual-owner-service route registry (cmd/apidocgen); do not edit by hand.
components:
  responses:
    Error:
      content:
        application/json:
          schema:
            $ref: ../../schemas/error-envelope.schema.json
      description: Platform error envelope.
  schemas:
    AccountStatusView:
      properties:
        account_id:
          format: uuid
          type: string
        activation_rule:
          type: string
        closure_effective_at:
          format: date-time
          type:
            - string
            - "null"
        email_verified:
          type: boolean
        gates:
          items:
            $ref: '#/components/schemas/GateView'
          type: array
        identity_verification_expires_at:
          format: date-time
          type:
            - string
            - "null"
        identity_verification_status:
          description: NONE or the latest IDENTITY verification status
          type: string
        mfa_enabled:
          type: boolean
        phone_verified:
          type: boolean
        policy_version:
          type: string
        status:
          type: string
      required:
        - account_id
        - status
        - activation_rule
        - email_verified
        - phone_verified
        - mfa_enabled
        - identity_verification_status
        - gates
        - policy_version
      type: object
    AddEvidenceInputInput:
      additionalProperties: false
      properties:
        documents:
          items:
            $ref: '#/components/schemas/DocumentInputInput'
          maxItems: 20
          minItems: 1
          type: array
      required:
        - documents
      type: object
    AddPayoutAccountInputInput:
      additionalProperties: false
      properties:
        account_name:
          maxLength: 160
          type: string
        account_number:
          description: Forwarded to payment-service; only the last 4 digits are kept
          pattern: ^(?:[0-9]{6,20})$
          type: string
        bank_code:
          examples:
            - "058"
          pattern: ^(?:[A-Z0-9]{2,20})$
          type: string
        bank_name:
          maxLength: 120
          type: string
        currency:
          examples:
            - NGN
          pattern: ^[A-Z]{3}$
          type: string
      required:
        - bank_code
        - bank_name
        - account_name
        - account_number
        - currency
      type: object
    AddressInputInput:
      additionalProperties: false
      properties:
        area_label:
          description: Public neighbourhood label
          maxLength: 120
          type: string
        city:
          maxLength: 100
          type: string
        country_code:
          examples:
            - NG
          pattern: ^[A-Z]{2}$
          type: string
        latitude:
          maximum: 90
          minimum: -90
          type: number
        line1:
          maxLength: 200
          type: string
        line2:
          maxLength: 200
          type: string
        longitude:
          maximum: 180
          minimum: -180
          type: number
        postal_code:
          maxLength: 20
          type: string
        state_region:
          maxLength: 100
          type: string
        visibility:
          description: Public address precision; default APPROXIMATE
          enum:
            - EXACT
            - APPROXIMATE
            - HIDDEN
          type: string
      required:
        - line1
        - city
        - state_region
        - country_code
      type: object
