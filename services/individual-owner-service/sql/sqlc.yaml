version: "2"
sql:
  - engine: postgresql
    schema: ../migrations
    queries: queries
    gen:
      go:
        package: db
        out: ../internal/repositories/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_methods_with_db_argument: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/CosmicforgeHealthnet/cosmicforge-realestate/shared/go/ids
              type: ID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/CosmicforgeHealthnet/cosmicforge-realestate/shared/go/ids
              type: ID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: inet
            go_type:
              import: net/netip
              type: Addr
          - db_type: inet
            nullable: true
            go_type:
              import: net/netip
              type: Addr
              pointer: true
