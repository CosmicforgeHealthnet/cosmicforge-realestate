# Prepared artifact ONLY. Include after green affected CI, certified digest,
# approved secrets/DB/extensions and staging change approval. Never use alone.
x-owner: &owner
  image: ${IMAGE_REGISTRY:-ghcr.io/cosmicforgehealthnet/cosmicforge-realestate}/individual-owner-service@${INDIVIDUAL_OWNER_SERVICE_DIGEST:?set the certified immutable Owner digest}
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  user: nonroot:nonroot
  restart: unless-stopped
  stop_grace_period: 30s
  networks: [backend]
  cpus: 2
  mem_limit: 1g
  pids_limit: 128
  volumes:
    - ${SECRETS_DIR:-/etc/cosmicforge}/individual-owner:/run/secrets/owner:ro
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}
x-owner-env: &owner-env
  APP_ENV: staging
  LOG_LEVEL: ${LOG_LEVEL:-info}
  NOTIFICATION_SERVICE_URL: http://notification-api:8080
  VERIFICATION_SERVICE_URL: http://verification-api:8080
  MEDIA_SERVICE_URL: http://media-api:8080
services:
  api-gateway:
    environment:
      GATEWAY_UPSTREAM_INDIVIDUAL_OWNER_SERVICE_URL: http://owner-api:8080
    depends_on:
      owner-api: {condition: service_healthy}
  owner-migrate:
    <<: *owner
    restart: "no"
    command: [/app/migrate, up]
    environment: {APP_ENV: staging}
    env_file:
      - path: ${SECRETS_DIR:-/etc/cosmicforge}/individual-owner-migrate.env
        required: true
    healthcheck: {disable: true}
  owner-api:
    <<: *owner
    command: [/app/api]
    environment:
      <<: *owner-env
      HTTP_ADDR: ":8080"
    env_file:
      - path: ${SECRETS_DIR:-/etc/cosmicforge}/individual-owner-api.env
        required: true
    healthcheck:
      test: [CMD, /app/api, readinesscheck]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      owner-migrate: {condition: service_completed_successfully}
      notification-api: {condition: service_healthy}
  owner-worker:
    <<: *owner
    command: [/app/worker]
    environment:
      <<: *owner-env
      HTTP_ADDR: ":8081"
    env_file:
      - path: ${SECRETS_DIR:-/etc/cosmicforge}/individual-owner-worker.env
        required: true
    healthcheck:
      test: [CMD, /app/worker, readinesscheck]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      owner-migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}
